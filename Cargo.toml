[package]
name = "iris-lib"
version = "0.1.1"
edition = "2021"
authors = ["Andrej G."]
license = "MIT"
description = "A library that creates color palettes from images using the median cut algorithm."
readme = "README.md"
homepage = "https://github.com/Kaesebrot84/iris-lib"
repository = "https://github.com/Kaesebrot84/iris-lib"
keywords = ["cli", "image", "color", "quantization"]
categories = ["algorithms"]

[dependencies]
rand = { version = "0.9.1", features = ["thread_rng"]}
image = { version = "0.25.6", optional = true }

[features]
image = ["dep:image"]


